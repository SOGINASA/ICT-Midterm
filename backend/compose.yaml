services:
  api:
    build: .
    env_file:
      - .env.production
    environment:
      DATABASE_URL: sqlite:////data/tengeflow.sqlite3
      JWT_SECRET_KEY: ""
      RATELIMIT_STORAGE_URI: memory://
      SMTP_HOST: ""
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      WEB_CONCURRENCY: "1"
    ports:
      - "127.0.0.1:${PORT:-1488}:1488"
    volumes:
      - tengeflow-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:1488/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  tengeflow-data: